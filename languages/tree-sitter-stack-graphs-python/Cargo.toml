[package]
name = "tree-sitter-stack-graphs-python"
version = "0.3.0"
description = "Stack graphs definition for Python using tree-sitter-python"
readme = "README.md"
keywords = ["tree-sitter", "stack-graphs", "python"]
authors = [
    "GitHub <opensource+stack-graphs@github.com>",
]
license = "MIT OR Apache-2.0"
edition = "2018"

[[bin]]
name = "tree-sitter-stack-graphs-python"
path = "rust/bin.rs"
required-features = ["cli"]

[lib]
path = "rust/lib.rs"
test = false

[[test]]
name = "test"
path = "rust/test.rs"
harness = false

[[test]]
name = "builtins"
path = "rust/builtins.rs"

[[test]]
name = "call_chains"
path = "rust/call_chains.rs"

[[test]]
name = "union_marker"
path = "rust/union_marker.rs"

[[test]]
name = "incremental"
path = "rust/incremental_test.rs"
required-features = ["incremental"]

[features]
cli = ["anyhow", "clap", "tree-sitter-stack-graphs/cli"]
# The incremental lowering prototype. Off by default.
incremental = ["tree-sitter"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
stack-graphs = { version = "0.14", path = "../../stack-graphs" }
tree-sitter-stack-graphs = { version = "0.10", path = "../../tree-sitter-stack-graphs" } # explicit version is required to be able to publish crate
tree-sitter-python = "=0.23.5"
tree-sitter = { version = "0.24", optional = true }

[dev-dependencies]
anyhow = "1.0"
tree-sitter-stack-graphs = { path = "../../tree-sitter-stack-graphs", features = ["cli"] }
