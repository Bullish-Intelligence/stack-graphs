# This is a local copy of tree-sitter-graph 0.12.0 from crates.io. It has two changes.
# 1. The syntax node identifier in `src/graph.rs` has the type `usize`. The upstream type is `u32`.
#    Upstream cuts the address of a tree-sitter node to 32 bits. Two nodes of one tree can get the
#    same identifier when the heap spans more than 4 GiB. The execution then fails with
#    "Duplicate variable" or reads the wrong node.
# 2. `replace` in `src/functions.rs` keeps each compiled regex in a cache of the thread. Upstream
#    compiles the pattern on each call.
# Upstream commit: b930fb59 (tree-sitter/tree-sitter-graph, the newest upstream commit when this
# copy was made; upstream released 0.12.0 on 2024-12-11).
# crates.io checksum of the 0.12.0 package, as the Cargo.lock of this repository had it before
# the vendoring (commit 37ef2f3):
# 63f86eb73c7d891c4b9b6fe4d4e63dd94c506e4788af7c2296afdcfbeea626cc
# A crates.io publish of the parent crate needs a published fork of this crate, or the two
# changes above are lost.
# This copy has no binary. Its tests are the unit tests of the regex cache and the integration
# tests of upstream 0.12.0 in `tests/it`, with the tests for the changes above.
# Run them with `cargo test -p tree-sitter-graph`.

[package]
edition = "2018"
name = "tree-sitter-graph"
version = "0.12.0"
authors = ["Douglas Creager <dcreager@dcreager.net>"]
description = "Construct graphs from parsed source code"
homepage = "https://github.com/tree-sitter/tree-sitter-graph/"
readme = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/tree-sitter/tree-sitter-graph/"

[lib]
name = "tree_sitter_graph"
path = "src/lib.rs"
test = true
doctest = false

[[test]]
name = "it"
path = "tests/it/main.rs"

[dependencies]
colored = { version = "2", optional = true }
log = "0.4"
regex = "1.3.2"
serde = "1.0"
serde_json = "1.0"
smallvec = { version = "1.6", features = ["union"] }
streaming-iterator = "0.1.9"
thiserror = "1.0.7"
tree-sitter = "0.24"

[features]
term-colors = ["colored"]

[dev-dependencies]
env_logger = "0.9"
indoc = "1.0"
tree-sitter-python = "=0.23.5"
